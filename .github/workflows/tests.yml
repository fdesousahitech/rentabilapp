name: Tests du comparateur fiscal

on:
  push:
    paths: ["**.js", "**.html", "package.json", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["**.js", "**.html", "package.json", ".github/workflows/tests.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
